[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crewops"
version = "1.0.0"
description = "Multi-Agent DevOps Incident Analysis Suite"
requires-python = ">=3.10"
dependencies = [
    "langchain-core>=0.3.0",
    "langchain>=0.3.0",
    "langgraph>=0.3.0",
    "langsmith>=0.1.0",
    "langchain-openrouter>=0.0.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "jira>=3.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
]
rag = [
    "lancedb>=0.8.0",
    "llama-index>=0.11.0",
    "llama-index-core>=0.11.0",
    "llama-index-vector-stores-lancedb>=0.3.0",
    # Local embeddings — no OpenAI key required
    "llama-index-embeddings-huggingface>=0.4.0",
    "sentence-transformers>=2.2.0",
]
ui = [
    "fastapi==0.136.1",
    "streamlit>=1.45.0",
    "uvicorn==0.46.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --no-header --color=yes -p no:warnings"
