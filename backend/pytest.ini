[pytest]
# ── Test Discovery ────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Output ───────────────────────────────────────────────────
addopts =
    -v
    --tb=short
    --strict-markers
    --no-header
    -p no:warnings
    --color=yes

# ── Markers ───────────────────────────────────────────────────
markers =
    unit: Pure unit tests (no I/O, no mocking of external services)
    integration: Tests that mock external services (JIRA, Slack, n8n)
    slow: Tests that take longer than 1 second
    graph: Tests for LangGraph topology and routing

# ── Coverage (if pytest-cov installed) ────────────────────────
# Uncomment to enable coverage:
# addopts = -v --tb=short --cov=src/crewops --cov-report=term-missing

# ── Timeout ──────────────────────────────────────────────────
# Requires pytest-timeout:
# timeout = 30
